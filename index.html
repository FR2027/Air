<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 高速離線 QR 檔案傳輸</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 qrcode.js -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <!-- 引入 jsQR -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 font-sans">

    <header class="w-full max-w-md text-center py-2">
        <h1 class="text-2xl font-black tracking-wider text-emerald-400">⚡ Air-QR 檔案傳輸</h1>
        <p class="text-xs text-slate-400 mt-1">純前端、無伺服器、高色資料光學傳輸</p>
    </header>

    <main class="w-full max-w-md flex flex-col gap-4">
        
        <!-- 頁籤按鈕 -->
        <div class="flex bg-slate-900 p-1.5 rounded-2xl border border-slate-800">
            <button id="tabSendBtn" onclick="switchTab('send')" class="flex-1 py-2.5 text-sm font-bold rounded-xl bg-emerald-600 text-white shadow-lg transition">傳送端 (Sender)</button>
            <button id="tabRecvBtn" onclick="switchTab('recv')" class="flex-1 py-2.5 text-sm font-bold rounded-xl text-slate-400 transition">接收端 (Receiver)</button>
        </div>

        <!-- 傳送端面板 -->
        <div id="sendPanel" class="flex flex-col gap-4 bg-slate-900/80 border border-slate-800 p-5 rounded-3xl shadow-2xl">
            <div>
                <label class="block text-sm font-semibold mb-2 text-slate-300">選擇要傳輸的檔案</label>
                <input type="file" id="fileInput" class="w-full text-xs text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-500 file:text-slate-950 hover:file:bg-emerald-400 cursor-pointer transition">
            </div>

            <!-- QR Code 顯示畫布 -->
            <div class="flex flex-col items-center justify-center bg-white p-3 rounded-2xl aspect-square shadow-inner">
                <canvas id="qrCanvas" class="w-full h-full object-contain"></canvas>
            </div>

            <div class="flex justify-between items-center text-xs text-slate-400 px-1">
                <span id="statusText" class="font-medium text-emerald-400">等待選擇檔案...</span>
                <span id="fpsText" class="bg-slate-800 px-2.5 py-1 rounded-lg text-slate-300">播放速度: 8 FPS</span>
            </div>

            <div class="flex gap-2.5">
                <button id="startSendBtn" onclick="startSending()" disabled class="flex-1 py-3.5 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 disabled:text-slate-600 font-black rounded-2xl transition shadow-lg cursor-pointer">開始播放傳送</button>
                <button onclick="stopSending()" class="px-5 py-3.5 bg-rose-900/40 hover:bg-rose-900/70 text-rose-300 font-bold rounded-2xl transition cursor-pointer">停止</button>
            </div>
        </div>

        <!-- 接收端面板 -->
        <div id="recvPanel" class="hidden flex flex-col gap-4 bg-slate-900/80 border border-slate-800 p-5 rounded-3xl shadow-2xl">
            <div class="relative bg-black rounded-2xl overflow-hidden aspect-square flex items-center justify-center shadow-inner">
                <video id="videoElement" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="scanCanvas" class="hidden"></canvas>
                <div class="absolute inset-0 border-4 border-emerald-500/30 rounded-2xl pointer-events-none"></div>
            </div>

            <div class="flex flex-col gap-1.5 px-1">
                <div class="flex justify-between text-xs text-slate-400">
                    <span id="recvStatus" class="font-medium text-slate-300">相機準備就緒</span>
                    <span id="progressText" class="font-bold text-emerald-400">0%</span>
                </div>
                <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
                    <div id="progressBar" class="bg-emerald-500 h-full w-0 rounded-full transition-all duration-150"></div>
                </div>
            </div>

            <div class="flex gap-2.5">
                <button onclick="startCamera()" class="flex-1 py-3.5 bg-emerald-600 hover:bg-emerald-500 font-black rounded-2xl transition shadow-lg cursor-pointer">啟動相機掃描</button>
                <button onclick="stopCamera()" class="px-5 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-2xl transition cursor-pointer">關閉</button>
            </div>
            
            <div id="downloadArea" class="hidden">
                <a id="downloadLink" class="block w-full py-3.5 bg-sky-600 hover:bg-sky-500 text-center font-black text-white rounded-2xl shadow-lg transition">下載接收到的檔案 📥</a>
            </div>
        </div>

    </main>

    <footer class="text-[11px] text-slate-600 py-2">
        GitHub Pages Powered Web Transfer
    </footer>

    <script>
        let rawFileChunks = []; // 儲存純文字封包字串
        let currentChunkIndex = 0;
        let sendInterval = null;
        let videoStream = null;
        let scanInterval = null;
        
        let receivedChunks = {};
        let totalChunks = 0;
        let fileName = "file.dat";
        let fileType = "application/octet-stream";
        let isCompleted = false;

        function switchTab(tab) {
            const sendBtn = document.getElementById('tabSendBtn');
            const recvBtn = document.getElementById('tabRecvBtn');
            const sendPanel = document.getElementById('sendPanel');
            const recvPanel = document.getElementById('recvPanel');

            if (tab === 'send') {
                sendBtn.className = "flex-1 py-2.5 text-sm font-bold rounded-xl bg-emerald-600 text-white shadow-lg transition";
                recvBtn.className = "flex-1 py-2.5 text-sm font-bold rounded-xl text-slate-400 transition";
                sendPanel.classList.remove('hidden');
                recvPanel.classList.add('hidden');
                stopCamera();
            } else {
                recvBtn.className = "flex-1 py-2.5 text-sm font-bold rounded-xl bg-emerald-600 text-white shadow-lg transition";
                sendBtn.className = "flex-1 py-2.5 text-sm font-bold rounded-xl text-slate-400 transition";
                recvPanel.classList.remove('hidden');
                sendPanel.classList.add('hidden');
                stopSending();
            }
        }

        // 為了確保手機鏡頭能超高速且 100% 準確辨識，限制每個分包為 80 bytes
        const CHUNK_SIZE = 80;

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 1024 * 1024 * 2) {
                alert("為了確保網頁光學傳輸穩定，請選擇小於 2MB 的檔案！");
                return;
            }

            document.getElementById('statusText').innerText = `正在編碼: ${file.name}...`;
            const buffer = await file.arrayBuffer();
            const bytes = new Uint8Array(buffer);
            
            rawFileChunks = [];
            totalChunks = Math.ceil(bytes.length / CHUNK_SIZE);
            fileName = file.name;
            fileType = file.type || "application/octet-stream";

            // 建立表頭結構：JSON 存放檔名、總數、型態與當前片段資料 (Base64)
            for (let i = 0; i < totalChunks; i++) {
                const chunkBytes = bytes.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
                let binaryStr = "";
                for (let b = 0; b < chunkBytes.length; b++) {
                    binaryStr += String.fromCharCode(chunkBytes[b]);
                }

                const packet = {
                    i: i,
                    t: totalChunks,
                    n: encodeURIComponent(fileName),
                    m: fileType,
                    d: btoa(binaryStr)
                };
                rawFileChunks.push(JSON.stringify(packet));
            }

            document.getElementById('statusText').innerText = `準備就緒！共 ${totalChunks} 個影格`;
            document.getElementById('startSendBtn').disabled = false;
            renderPreviewFrame();
        });

        function renderPreviewFrame() {
            if (rawFileChunks.length === 0) return;
            const canvas = document.getElementById('qrCanvas');
            QRCode.toCanvas(canvas, rawFileChunks[0], { 
                errorCorrectionLevel: 'L', 
                width: 350, 
                margin: 1 
            }, function (error) {
                if (error) console.error(error);
            });
        }

        function startSending() {
            if (rawFileChunks.length === 0) return;
            stopSending();
            currentChunkIndex = 0;

            const fps = 8; // 每秒 8 影格，兼具速度與辨識率
            const canvas = document.getElementById('qrCanvas');

            sendInterval = setInterval(() => {
                QRCode.toCanvas(canvas, rawFileChunks[currentChunkIndex], { 
                    errorCorrectionLevel: 'L', 
                    width: 350, 
                    margin: 1 
                }, function (error) {
                    if (!error) {
                        document.getElementById('statusText').innerText = `廣播中: ${currentChunkIndex + 1} / ${totalChunks}`;
                    }
                });

                currentChunkIndex = (currentChunkIndex + 1) % rawFileChunks.length;
            }, 1000 / fps);
        }

        function stopSending() {
            if (sendInterval) {
                clearInterval(sendInterval);
                sendInterval = null;
            }
        }

        async function startCamera() {
            try {
                receivedChunks = {};
                isCompleted = false;
                document.getElementById('downloadArea').classList.add('hidden');
                document.getElementById('progressBar').style.width = '0%';
                document.getElementById('progressText').innerText = '0%';
                
                const video = document.getElementById('videoElement');
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = videoStream;
                video.play();

                document.getElementById('recvStatus').innerText = "正在對準掃描中...";
                scanInterval = setInterval(scanFrame, 60); // 頻繁擷取畫面
            } catch (err) {
                alert("無法開啟相機，請確認是否允許相機權限且網址為 HTTPS。");
                console.error(err);
            }
        }

        function stopCamera() {
            if (scanInterval) {
                clearInterval(scanInterval);
                scanInterval = null;
            }
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
        }

        function scanFrame() {
            const video = document.getElementById('videoElement');
            const canvas = document.getElementById('scanCanvas');
            if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imgData.data, imgData.width, imgData.height);

            if (code && !isCompleted) {
                try {
                    const data = JSON.parse(code.data);
                    if (data.i !== undefined && data.t !== undefined && data.d) {
                        if (!receivedChunks[data.i]) {
                            receivedChunks[data.i] = data.d;
                            totalChunks = data.t;
                            fileName = decodeURIComponent(data.n);
                            fileType = data.m;

                            const count = Object.keys(receivedChunks).length;
                            const percent = Math.round((count / totalChunks) * 100);
                            
                            document.getElementById('progressBar').style.width = percent + '%';
                            document.getElementById('progressText').innerText = percent + '%';
                            document.getElementById('recvStatus').innerText = `已收集: ${count} / ${totalChunks}`;

                            if (count === totalChunks) {
                                assembleFile();
                            }
                        }
                    }
                } catch (e) {
                    // 非本應用程式的 QR 碼自動略過
                }
            }
        }

        function assembleFile() {
            isCompleted = true;
            stopCamera();
            document.getElementById('recvStatus').innerText = "🎉 檔案接收完畢！";

            let uint8Arrays = [];
            for (let i = 0; i < totalChunks; i++) {
                const binStr = atob(receivedChunks[i]);
                const len = binStr.length;
                const bytes = new Uint8Array(len);
                for (let j = 0; j < len; j++) {
                    bytes[j] = binStr.charCodeAt(j);
                }
                uint8Arrays.push(bytes);
            }

            const blob = new Blob(uint8Arrays, { type: fileType });
            const url = URL.createObjectURL(blob);
            
            const link = document.getElementById('downloadLink');
            link.href = url;
            link.download = fileName;
            document.getElementById('downloadArea').classList.remove('hidden');
        }
    </script>
</body>
</html>
