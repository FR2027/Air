<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR Air &bull; 高速檔案傳輸</title>
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/TqntYvwV/Background-Eraser-20260826-155325630.jpg">
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 25px rgba(59, 130, 246, 0.15), inset 0 0 15px rgba(255, 255, 255, 0.05); }
            50% { box-shadow: 0 0 50px rgba(59, 130, 246, 0.35), inset 0 0 25px rgba(255, 255, 255, 0.1); }
        }
        .liquid-glass {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .liquid-glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .glow-card {
            animation: pulse-glow 4s infinite ease-in-out;
        }
        .floating-orb {
            animation: float 8s infinite ease-in-out;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.4);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.3);
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(59, 130, 246, 0.6);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-slate-950 font-sans antialiased overflow-x-hidden" oncontextmenu="return false;">

    <!-- 動態流光背景 (藍色科技主題) -->
    <div class="fixed top-[-10%] left-1/2 -translate-x-1/2 w-[800px] h-[450px] bg-gradient-to-tr from-blue-600/20 via-indigo-500/15 to-cyan-500/5 blur-[140px] pointer-events-none rounded-full floating-orb"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-blue-500/10 blur-[160px] pointer-events-none rounded-full"></div>

    <!-- 頂部導航列 -->
    <header class="w-full border-b border-white/5 liquid-glass sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3.5">
                <div class="w-12 h-12 rounded-2xl p-0.5 bg-gradient-to-tr from-blue-500 to-cyan-300 shadow-lg shadow-blue-900/40 flex items-center justify-center overflow-hidden">
                    <img src="https://i.ibb.co/TqntYvwV/Background-Eraser-20260826-155325630.jpg" alt="FR Air Logo" class="w-full h-full object-cover rounded-[14px]">
                </div>
                <div>
                    <h1 class="font-black text-xl tracking-tight bg-gradient-to-r from-blue-400 via-indigo-300 to-cyan-300 bg-clip-text text-transparent">FR Air</h1>
                    <p class="text-[10px] text-slate-400 font-semibold tracking-widest uppercase">FR 高速檔案傳輸網站</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span id="connectionBadge" class="px-3.5 py-1.5 rounded-full text-xs font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center gap-2 shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    等待連線
                </span>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="w-full max-w-2xl mx-auto px-4 py-10 flex-1 flex flex-col gap-6 z-10">

        <!-- 模式切換標籤 -->
        <div class="grid grid-cols-2 gap-2 liquid-glass p-2 rounded-2xl shadow-2xl">
            <button onclick="switchTab('send')" id="tabSend" class="py-3.5 rounded-xl font-bold text-sm transition-all duration-300 flex items-center justify-center gap-2.5 bg-gradient-to-r from-blue-500 to-cyan-500 text-slate-950 shadow-lg shadow-blue-950/50 cursor-pointer">
                <i data-lucide="upload-cloud" class="w-4 h-4"></i>
                傳送檔案 (Sender)
            </button>
            <button onclick="switchTab('recv')" id="tabRecv" class="py-3.5 rounded-xl font-bold text-sm transition-all duration-300 flex items-center justify-center gap-2.5 text-slate-400 hover:text-slate-200 cursor-pointer">
                <i data-lucide="download-cloud" class="w-4 h-4"></i>
                接收檔案 (Receiver)
            </button>
        </div>

        <!-- ================= 傳送端面板 ================= -->
        <div id="panelSend" class="flex flex-col gap-6">
            <div class="liquid-glass rounded-3xl p-8 shadow-2xl glow-card flex flex-col gap-6">
                <div class="flex items-center justify-between">
                    <h2 class="text-base font-bold text-slate-200 flex items-center gap-2.5">
                        <i data-lucide="sparkles" class="w-5 h-5 text-blue-400"></i>
                        拖曳或選擇檔案（支援 1GB+ 大型檔案）
                    </h2>
                    <span class="text-xs text-blue-400/80 font-mono bg-blue-500/10 px-2.5 py-1 rounded-lg border border-blue-500/20">支援 1GB+</span>
                </div>

                <!-- 檔案上傳拖曳區 -->
                <label id="dropZone" class="border-2 border-dashed border-slate-700/80 hover:border-blue-500 bg-slate-950/30 hover:bg-blue-950/10 rounded-2xl p-10 flex flex-col items-center justify-center gap-4 transition-all duration-300 cursor-pointer group">
                    <div class="w-16 h-16 rounded-2xl bg-slate-900/80 group-hover:bg-blue-500/20 group-hover:scale-110 flex items-center justify-center transition-all duration-300 shadow-xl">
                        <i data-lucide="folder-open" class="w-7 h-7 text-slate-400 group-hover:text-blue-400 transition-colors"></i>
                    </div>
                    <div class="text-center">
                        <p class="text-sm font-bold text-slate-200 group-hover:text-blue-300 transition-colors">點擊選擇檔案 或 將檔案拖曳至此</p>
                        <p class="text-xs text-slate-400 mt-1">完美支援 1GB 以上大型影片、壓縮檔與高畫質照片直傳</p>
                    </div>
                    <input type="file" id="fileInput" class="hidden">
                </label>

                <!-- 已選檔案預覽 -->
                <div id="filePreview" class="hidden flex items-center justify-between p-4 liquid-glass-card rounded-2xl border border-white/5">
                    <div class="flex items-center gap-3.5 overflow-hidden">
                        <div class="w-11 h-11 rounded-xl bg-blue-500/10 flex items-center justify-center shrink-0 border border-blue-500/20">
                            <i data-lucide="file-check" class="w-5 h-5 text-blue-400"></i>
                        </div>
                        <div class="overflow-hidden">
                            <p id="fileName" class="text-sm font-bold text-slate-200 truncate"></p>
                            <p id="fileSize" class="text-xs text-slate-400 mt-0.5 font-mono"></p>
                        </div>
                    </div>
                    <button onclick="clearFile()" class="p-2 text-slate-400 hover:text-rose-400 transition-colors cursor-pointer rounded-xl hover:bg-rose-500/10">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- 連線代碼產生區 -->
                <div class="flex flex-col gap-3 pt-4 border-t border-white/5">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">傳輸金鑰代碼</span>
                        <button onclick="generateNewRoom()" class="text-xs text-blue-400 hover:text-blue-300 flex items-center gap-1 font-semibold cursor-pointer">
                            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> 重新產生
                        </button>
                    </div>
                    <div class="flex gap-3">
                        <div class="flex-1 bg-slate-950/60 border border-white/10 rounded-2xl px-5 py-3.5 flex items-center justify-between shadow-inner">
                            <span class="text-xs text-slate-500 font-mono">FR-KEY</span>
                            <span id="roomCodeDisplay" class="text-2xl font-black tracking-[0.3em] text-blue-400 font-mono">------</span>
                        </div>
                        <button onclick="copyRoomCode()" class="px-6 bg-slate-800/80 hover:bg-slate-700 text-slate-200 font-bold rounded-2xl text-xs transition-all flex items-center gap-2 cursor-pointer shadow-lg border border-white/10">
                            <i data-lucide="copy" class="w-4 h-4"></i> 複製
                        </button>
                    </div>
                </div>

                <!-- 傳輸進度條 -->
                <div id="sendProgressContainer" class="hidden flex flex-col gap-2.5 pt-2">
                    <div class="flex justify-between text-xs font-medium">
                        <span id="sendProgressStatus" class="text-slate-300">高速傳輸中...</span>
                        <span id="sendProgressPercent" class="text-blue-400 font-mono font-bold">0%</span>
                    </div>
                    <div class="w-full bg-slate-950/80 h-3.5 rounded-full overflow-hidden p-0.5 border border-white/10">
                        <div id="sendProgressBar" class="bg-gradient-to-r from-blue-500 via-indigo-400 to-cyan-400 h-full w-0 rounded-full transition-all duration-150 shadow-lg shadow-blue-500/50"></div>
                    </div>
                </div>

                <button id="startSendBtn" onclick="startHosting()" disabled class="w-full py-4 bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-400 hover:to-cyan-400 disabled:from-slate-800 disabled:to-slate-800 disabled:text-slate-600 text-slate-950 font-black rounded-2xl transition-all shadow-xl shadow-blue-950/50 flex items-center justify-center gap-2.5 cursor-pointer text-base">
                    <i data-lucide="radio" class="w-5 h-5"></i> 啟動 FR Air 高速傳輸
                </button>
            </div>
        </div>

        <!-- ================= 接收端面板 ================= -->
        <div id="panelRecv" class="hidden flex flex-col gap-6">
            <div class="liquid-glass rounded-3xl p-8 shadow-2xl flex flex-col gap-6">
                <div class="flex items-center justify-between">
                    <h2 class="text-base font-bold text-slate-200 flex items-center gap-2.5">
                        <i data-lucide="zap" class="w-5 h-5 text-blue-400"></i>
                        輸入 FR 傳輸代碼接收 1GB+ 檔案
                    </h2>
                    <span class="text-xs text-blue-400/80 font-mono bg-blue-500/10 px-2.5 py-1 rounded-lg border border-blue-500/20">FR科技</span>
                </div>

                <div class="flex flex-col gap-3">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">輸入 6 位數安全代碼</label>
                    <input type="text" id="inputRoomCode" maxlength="6" placeholder="849201" class="w-full py-4 px-5 bg-slate-950/60 border border-white/10 rounded-2xl text-center text-3xl font-black tracking-[0.5em] text-blue-400 font-mono focus:outline-none focus:border-blue-500 transition-all shadow-inner">
                </div>

                <!-- 接收進度條 -->
                <div id="recvProgressContainer" class="hidden flex flex-col gap-2.5 pt-2">
                    <div class="flex justify-between text-xs font-medium">
                        <span id="recvProgressStatus" class="text-slate-300">接收並解密中...</span>
                        <span id="recvProgressPercent" class="text-blue-400 font-mono font-bold">0%</span>
                    </div>
                    <div class="w-full bg-slate-950/80 h-3.5 rounded-full overflow-hidden p-0.5 border border-white/10">
                        <div id="recvProgressBar" class="bg-gradient-to-r from-blue-500 via-indigo-400 to-cyan-400 h-full w-0 rounded-full transition-all duration-150 shadow-lg shadow-blue-500/50"></div>
                    </div>
                </div>

                <button onclick="connectAndReceive()" class="w-full py-4 bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-400 hover:to-cyan-400 text-slate-950 font-black rounded-2xl transition-all shadow-xl shadow-blue-950/50 flex items-center justify-center gap-2.5 cursor-pointer text-base">
                    <i data-lucide="download" class="w-5 h-5"></i> 連線並高速接收
                </button>

                <!-- 下載完成區 -->
                <div id="recvSuccessArea" class="hidden flex flex-col items-center justify-center gap-4 p-6 bg-blue-950/30 border border-blue-500/30 rounded-2xl text-center backdrop-blur-md">
                    <div class="w-14 h-14 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-400 shadow-lg shadow-blue-900/50">
                        <i data-lucide="check" class="w-7 h-7"></i>
                    </div>
                    <div>
                        <p class="font-bold text-slate-100 text-base" id="successFileName">檔案接收完成</p>
                        <p class="text-xs text-slate-400 mt-1">完整性驗證通過，零失真直傳</p>
                    </div>
                    <a id="downloadLink" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-sky-500 hover:from-cyan-400 hover:to-sky-400 text-slate-950 font-black rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
                        <i data-lucide="save" class="w-4 h-4"></i> 儲存檔案到裝置
                    </a>
                </div>
            </div>
        </div>

        <!-- 狀態日誌控制台 -->
        <div class="liquid-glass rounded-2xl p-4 flex flex-col gap-2 shadow-xl">
            <div class="flex items-center justify-between text-xs text-slate-400 font-mono">
                <span class="flex items-center gap-2 font-bold text-slate-300">
                    <i data-lucide="terminal" class="w-3.5 h-3.5 text-blue-400"></i> FR Air 傳送日誌
                </span>
                <button onclick="clearLogs()" class="hover:text-slate-200 cursor-pointer">清除日誌</button>
            </div>
            <div id="logBox" class="h-28 overflow-y-auto custom-scrollbar font-mono text-[11px] text-slate-400 flex flex-col gap-1.5 p-3 bg-slate-950/70 rounded-xl border border-white/5">
                <div>[FR Air] 系統初始化完成。支援 1GB+ 檔案極速傳輸。</div>
            </div>
        </div>

    </main>

    <!-- 懸浮按鈕：FR 10大網站 -->
    <a href="https://fr2027.github.io/FR" target="_blank" class="fixed bottom-6 right-6 z-50 px-4 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-xs rounded-full shadow-2xl shadow-blue-600/50 flex items-center gap-2 border border-white/20 transition-all hover:scale-105 cursor-pointer backdrop-blur-md">
        <i data-lucide="globe" class="w-4 h-4 text-cyan-300 animate-spin" style="animation-duration: 8s;"></i>
        <span>FR 10大網站</span>
    </a>

    <!-- 頁尾 -->
    <footer class="w-full border-t border-white/5 py-6 text-center text-xs text-slate-500">
        FR Air Engine &bull; Secure & High Speed &bull; 1GB+ Supported
    </footer>

    <!-- PeerJS 函式庫 -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        lucide.createIcons();

        // ------------------ 防止查看程式碼（防禦機製） ------------------
        document.addEventListener('keydown', function (e) {
            // 禁用 F12
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
            // 禁用 Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C / Ctrl+U
            if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && e.key.toUpperCase() === 'U') {
                e.preventDefault();
                return false;
            }
        });

        let currentTab = 'send';
        let selectedFile = null;
        let peer = null;
        let conn = null;
        let roomCode = '';
        
        function log(message, type = 'info') {
            const box = document.getElementById('logBox');
            const time = new Date().toLocaleTimeString();
            const color = type === 'error' ? 'text-rose-400' : (type === 'success' ? 'text-blue-400' : 'text-slate-300');
            box.innerHTML += `<div class="${color}">[${time}] ${message}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('logBox').innerHTML = '';
        }

        function switchTab(tab) {
            currentTab = tab;
            const tabSend = document.getElementById('tabSend');
            const tabRecv = document.getElementById('tabRecv');
            const panelSend = document.getElementById('panelSend');
            const panelRecv = document.getElementById('panelRecv');

            if (tab === 'send') {
                tabSend.className = "py-3.5 rounded-xl font-bold text-sm transition-all duration-300 flex items-center justify-center gap-2.5 bg-gradient-to-r from-blue-500 to-cyan-500 text-slate-950 shadow-lg shadow-blue-950/50 cursor-pointer";
                tabRecv.className = "py-3.5 rounded-xl font-bold text-sm transition-all duration-300 flex items-center justify-center gap-2.5 text-slate-400 hover:text-slate-200 cursor-pointer";
                panelSend.classList.remove('hidden');
                panelRecv.classList.add('hidden');
            } else {
                tabRecv.className = "py-3.5 rounded-xl font-bold text-sm transition-all duration-300 flex items-center justify-center gap-2.5 bg-gradient-to-r from-blue-500 to-cyan-500 text-slate-950 shadow-lg shadow-blue-950/50 cursor-pointer";
                tabSend.className = "py-3.5 rounded-xl font-bold text-sm transition-all duration-300 flex items-center justify-center gap-2.5 text-slate-400 hover:text-slate-200 cursor-pointer";
                panelRecv.classList.remove('hidden');
                panelSend.classList.add('hidden');
            }
        }

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-blue-500', 'bg-blue-950/20'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('border-blue-500', 'bg-blue-950/20'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-blue-500', 'bg-blue-950/20');
            if (e.dataTransfer.files.length > 0) {
                setFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                setFile(e.target.files[0]);
            }
        });

        function setFile(file) {
            selectedFile = file;
            document.getElementById('filePreview').classList.remove('hidden');
            dropZone.classList.add('hidden');
            document.getElementById('fileName').innerText = file.name;
            document.getElementById('fileSize').innerText = formatBytes(file.size);
            document.getElementById('startSendBtn').disabled = false;
            log(`已載入檔案: ${file.name} (${formatBytes(file.size)})`, 'success');
        }

        function clearFile() {
            selectedFile = null;
            fileInput.value = '';
            document.getElementById('filePreview').classList.add('hidden');
            dropZone.classList.remove('hidden');
            document.getElementById('startSendBtn').disabled = true;
            log('已清除所選檔案');
        }

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        function generateNewRoom() {
            roomCode = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('roomCodeDisplay').innerText = roomCode;
            log(`已產生傳輸代碼: ${roomCode}`);
        }
        generateNewRoom();

        function copyRoomCode() {
            navigator.clipboard.writeText(roomCode);
            log(`已複製代碼 ${roomCode} 至剪貼簿`, 'success');
            alert('已複製傳輸代碼: ' + roomCode);
        }

        function startHosting() {
            if (!selectedFile) return;
            
            const peerId = 'frair-' + roomCode;
            log(`正在註冊 FR Air 節點: ${peerId}`);
            
            peer = new Peer(peerId);

            peer.on('open', (id) => {
                log(`連線成功！節點在線，等待接收端連線...`, 'success');
                updateConnectionStatus('waiting', '等待接收端連線...');
                document.getElementById('startSendBtn').disabled = true;
            });

            peer.on('connection', (connection) => {
                conn = connection;
                log(`接收端已成功建立安全通道！`, 'success');
                updateConnectionStatus('connected', '已連線');
                setupSenderConnection();
            });

            peer.on('error', (err) => {
                log(`連線錯誤: ${err.type} - ${err.message}`, 'error');
                if (err.type === 'unavailable-id') {
                    generateNewRoom();
                    alert('代碼已被佔用，已自動重新產生，請重新點擊啟動！');
                }
            });
        }

        function updateConnectionStatus(status, text) {
            const badge = document.getElementById('connectionBadge');
            if (status === 'connected') {
                badge.className = "px-3.5 py-1.5 rounded-full text-xs font-bold bg-blue-500/10 text-blue-400 border border-blue-500/20 flex items-center gap-2 shadow-sm";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-400"></span> ${text}`;
            } else if (status === 'waiting') {
                badge.className = "px-3.5 py-1.5 rounded-full text-xs font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center gap-2 shadow-sm";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> ${text}`;
            }
        }

        // 傳送端資料發送邏輯（大檔案優化：128KB 區塊與索引對齊）
        function setupSenderConnection() {
            document.getElementById('sendProgressContainer').classList.remove('hidden');
            
            conn.on('open', () => {
                log(`開始發送檔案資訊: ${selectedFile.name} (${formatBytes(selectedFile.size)})`);
                
                const chunkSize = 128 * 1024; // 128 KB
                const totalChunks = Math.ceil(selectedFile.size / chunkSize);

                // 1. 傳送標頭
                conn.send({
                    type: 'file-meta',
                    name: selectedFile.name,
                    size: selectedFile.size,
                    fileType: selectedFile.type,
                    totalChunks: totalChunks
                });

                let chunkIndex = 0;
                const reader = new FileReader();
                let offset = 0;

                reader.onload = (e) => {
                    conn.send({
                        type: 'file-chunk',
                        index: chunkIndex,
                        data: e.target.result
                    });

                    offset += e.target.result.byteLength;
                    chunkIndex++;
                    
                    const percent = Math.round((offset / selectedFile.size) * 100);
                    document.getElementById('sendProgressBar').style.width = percent + '%';
                    document.getElementById('sendProgressPercent').innerText = percent + '%';
                    document.getElementById('sendProgressStatus').innerText = `傳輸中: ${formatBytes(offset)} / ${formatBytes(selectedFile.size)}`;

                    if (chunkIndex < totalChunks) {
                        readNextChunk();
                    } else {
                        log(`檔案高速傳輸完畢！`, 'success');
                        document.getElementById('sendProgressStatus').innerText = "傳輸完成！";
                    }
                };

                function readNextChunk() {
                    const slice = selectedFile.slice(offset, offset + chunkSize);
                    reader.readAsArrayBuffer(slice);
                }

                readNextChunk();
            });
        }

        // 接收端邏輯（支援 1GB+ 檔案分塊記憶體組合）
        let incomingFileMeta = null;
        let incomingChunks = [];
        let receivedChunksCount = 0;

        function connectAndReceive() {
            const code = document.getElementById('inputRoomCode').value.trim();
            if (code.length !== 6) {
                alert('請輸入正確的 6 位數傳輸代碼！');
                return;
            }

            const targetPeerId = 'frair-' + code;
            log(`正在連線至傳送端: ${targetPeerId}`);
            updateConnectionStatus('waiting', '正在建立通道...');

            peer = new Peer();

            peer.on('open', (id) => {
                conn = peer.connect(targetPeerId);

                conn.on('open', () => {
                    log(`FR Air連線成功！等待接收 1GB+ 檔案資料...`, 'success');
                    updateConnectionStatus('connected', '已連線');
                    document.getElementById('recvProgressContainer').classList.remove('hidden');
                });

                conn.on('data', (packet) => {
                    if (packet.type === 'file-meta') {
                        incomingFileMeta = packet;
                        incomingChunks = new Array(packet.totalChunks);
                        receivedChunksCount = 0;
                        log(`收到檔案標頭: ${packet.name} (${formatBytes(packet.size)})，共 ${packet.totalChunks} 個區塊`, 'success');
                    } else if (packet.type === 'file-chunk') {
                        incomingChunks[packet.index] = packet.data;
                        receivedChunksCount++;

                        const receivedBytes = incomingChunks.reduce((acc, chunk) => acc + (chunk ? chunk.byteLength : 0), 0);
                        const percent = Math.round((receivedBytes / incomingFileMeta.size) * 100);
                        
                        document.getElementById('recvProgressBar').style.width = percent + '%';
                        document.getElementById('recvProgressPercent').innerText = percent + '%';
                        document.getElementById('recvProgressStatus').innerText = `接收中: ${formatBytes(receivedBytes)} / ${formatBytes(incomingFileMeta.size)}`;

                        if (receivedChunksCount >= incomingFileMeta.totalChunks) {
                            log(`所有區塊接收完畢，正在進行高效能組裝...`, 'success');
                            assembleReceivedFile();
                        }
                    }
                });

                conn.on('error', (err) => {
                    log(`連線錯誤: ${err}`, 'error');
                    alert('連線失敗，請檢查代碼是否正確或傳送端是否在線。');
                });
            });
        }

        function assembleReceivedFile() {
            const blob = new Blob(incomingChunks, { type: incomingFileMeta.fileType || 'application/octet-stream' });
            const url = URL.createObjectURL(blob);

            const downloadLink = document.getElementById('downloadLink');
            downloadLink.href = url;
            downloadLink.download = incomingFileMeta.name;

            document.getElementById('successFileName').innerText = incomingFileMeta.name;
            document.getElementById('recvSuccessArea').classList.remove('hidden');
            document.getElementById('recvProgressStatus').innerText = "接收完成！";
            log(`檔案已高速傳輸完畢（支援 1GB+ 檔案），可點擊儲存: ${incomingFileMeta.name}`, 'success');
        }
    </script>
</body>
</html>
